version: "3.9"

services:

  mysql:
    image: mysql:8.0
    container_name: zabbix-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbix
    command:
      - --log-bin-trust-function-creators=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - monitornet

  zabbix-server:
    build: ./zabbix-server
    container_name: zabbix-server
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: mysql
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbix
    ports:
      - "10051:10051"
    healthcheck:
      test: ["CMD", "pgrep", "zabbix_server"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - monitornet

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:latest
    container_name: zabbix-web
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      zabbix-server:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: mysql
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zabbix
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: America/Sao_Paulo
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - monitornet

  zabbix-agent:
    image: zabbix/zabbix-agent:latest
    container_name: zabbix-agent
    restart: always
    environment:
      ZBX_SERVER_HOST: zabbix-server
    depends_on:
      zabbix-server:
        condition: service_healthy
    networks:
      - monitornet

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/login"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - monitornet

  wppconnect:
    build: ./wppconnect
    container_name: wppconnect
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - wpp_tokens:/opt/wpp-server/tokens
    shm_size: "1gb"
    depends_on:
      zabbix-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/status"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - monitornet

volumes:
  mysql_data:
  grafana_data:
  wpp_tokens:

networks:
  monitornet:
    driver: bridge